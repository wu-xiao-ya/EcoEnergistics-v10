name: Build mod

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew clean build -Pnet.minecraftforge.gradle.disableUpdateChecker=true
    - name: Check removed MekCEu API references
      shell: bash
      run: |
        forbidden='ContainerMekanism|SlotEnergy|NonNullListSynchronized|FluidHandlerWrapper|IFluidHandlerWrapper'
        for artifact in build/libs/*.jar; do
          case "$artifact" in
            *-sources.jar|*-javadoc.jar) continue ;;
          esac
          if jdeps --ignore-missing-deps -verbose:class -filter:none "$artifact" | grep -E "$forbidden"; then
            echo "Found references to removed MekCEu APIs in $artifact"
            exit 1
          fi
        done
    - name: Check solar GUI compatibility base
      shell: bash
      run: |
        artifact="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
        javap -classpath "$artifact" aeternal.ecoenergistics.client.gui.GuiEcoSolarGenerator |
          grep -F 'extends mekanism.client.gui.GuiMekanism<'
    - name: Upload jar artifact
      uses: actions/upload-artifact@v4
      with:
        name: EcoEnergistics-jar
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
          !build/libs/*-javadoc.jar
        if-no-files-found: error
    - name: Upload sources artifact
      uses: actions/upload-artifact@v4
      with:
        name: EcoEnergistics-sources
        path: build/libs/*-sources.jar
        if-no-files-found: error
